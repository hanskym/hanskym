name: Waka Readme

on:
  # for manual workflow trigger
  workflow_dispatch:
  schedule:
    # runs daily at 12:00 AM Jakarta time (WIB, UTC+7)
    - cron: "0 17 * * *"

jobs:
  update-readme:
    name: Update WakaTime Metrics
    runs-on: ubuntu-latest
    steps:
      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          SHOW_TITLE: true
          SHOW_TOTAL: true
          COMMIT_MESSAGE: "chore: update WakaTime metrics"
